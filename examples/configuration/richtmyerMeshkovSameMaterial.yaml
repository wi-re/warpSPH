schemaVersion: 1
case: richtmyerMeshkov
simulation:
  nx: 64
  tLimit: 2.0
  plot: true
  video: true
  progress: true
  plotInterval: 25
  execution: eager
solver:
  scheme: CRKSPH
  crkDensityPolicy: sameMaterial
  materials:
    - name: incidentGas
      eos: {type: idealGas, gamma: 1.4}
    - name: transmittedGas
      eos: {type: idealGas, gamma: 1.6666666666666667}
params:
  rho0: 1.0
  rho1: 3.0
  pressure: 1.0
  mach: 1.2
  amplitude: 0.01
