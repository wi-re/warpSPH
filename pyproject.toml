[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warpSPH"
version = "0.5.0"
authors = [
  { name="Rene Winchenbach", email="contact@fluids.dev" },
]
maintainers = [
  { name="Rene Winchenbach", email="contact@fluids.dev" },
]
description = "Cases, runner and examples for GPU SPH: compressible, weakly compressible and incompressible schemes on warpSPHCore"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["sph", "warp", "pytorch", "fluid-simulation", "neighbor-search", "crksph"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "torch",
    "warp-lang>=1.17.0",
    "numpy",
    "warpSPHCore>=0.5.0",
    "warpSPHPlotting>=0.5.0",
    "warpSPHIntegrators>=0.5.0",
    "vispy",
    "jupyter_rfb",
    "pyvirtualdisplay", "piglet", "glfw",
    "tqdm", "seaborn", "pandas", "pyglet", "dill", "numba", "scipy", "scikit-image", "h5py", "ipykernel", "ipympl"
]

[project.urls]
Repository = "https://github.com/wi-re/warpSPH"
Issues = "https://github.com/wi-re/warpSPH"

[project.optional-dependencies]
notebooks = [
    "matplotlib",
    "ipympl",
    "ipywidgets",
]
dev = [
    "pytest",
    "build",
    "twine",
    # Notebooks are committed stripped; see CONTRIBUTING.md.
    "nbstripout",
]

[project.scripts]
warpsph-run = "warpSPHRun:main"

[tool.setuptools]
package-dir = {"" = "src"}
# Must be importable before `warpSPH` -- they choose the precision that
# `warpSPHCore.type_config` locks in at its first import.
py-modules = ["warpSPHBootstrap", "warpSPHRun"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

